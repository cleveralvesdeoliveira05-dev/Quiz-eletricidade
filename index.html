<script type="module">
  // ============================================================
  // FIREBASE / FIRESTORE
  // ============================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // CONFIGURAÇÃO DO SEU FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyBPQWF7gxVV_8sDOBE02LP6Qtdxq9sg4y0",
    authDomain: "quiz-eletricidade.firebaseapp.com",
    projectId: "quiz-eletricidade",
    storageBucket: "quiz-eletricidade.firebasestorage.app",
    messagingSenderId: "886964306840",
    appId: "1:886964306840:web:71454653115fa89e8da1ed"
  };


  // Inicializa o Firebase
  const app = initializeApp(firebaseConfig);

  // Inicializa o Firestore
  const db = getFirestore(app);


  // ============================================================
  // DADOS DO QUIZ
  // ============================================================

  const questions = [
    {
      text: "Onde a eletricidade é produzida?",
      options: [
        "Nas casas",
        "Nas usinas",
        "Nas escolas",
        "Nos postes"
      ],
      correct: 1,
      explanation:
        "A eletricidade é gerada nas usinas antes de percorrer todo o caminho até as nossas casas."
    },

    {
      text: "Qual usina utiliza a força da água para produzir eletricidade?",
      options: [
        "Eólica",
        "Solar",
        "Hidrelétrica",
        "Termelétrica"
      ],
      correct: 2,
      explanation:
        "A usina hidrelétrica usa a força da água em movimento para gerar eletricidade."
    },

    {
      text: "Qual fonte de energia utiliza a força dos ventos?",
      options: [
        "Energia eólica",
        "Energia hidráulica",
        "Energia nuclear",
        "Energia térmica"
      ],
      correct: 0,
      explanation:
        "A energia eólica é produzida a partir da força dos ventos, que movem as turbinas."
    },

    {
      text: "O que acontece com a eletricidade depois de ser produzida na usina?",
      options: [
        "Ela é armazenada em todas as casas",
        "Ela é transportada por redes de transmissão e distribuição",
        "Ela vai diretamente para os aparelhos",
        "Ela desaparece no caminho"
      ],
      correct: 1,
      explanation:
        "Depois de gerada, a eletricidade viaja por redes de transmissão e distribuição até chegar aos consumidores."
    },

    {
      text: "Qual é o caminho simplificado da eletricidade desde a usina até chegar à nossa casa?",
      options: [
        "Casa → subestação → usina → transmissão → distribuição",
        "Usina → transmissão → subestação → distribuição → casa",
        "Usina → casa → subestação → transmissão → distribuição",
        "Subestação → casa → usina → transmissão → distribuição"
      ],
      correct: 1,
      explanation:
        "O caminho correto é: usina → transmissão → subestação → distribuição → casa."
    }
  ];


  // ============================================================
  // CAMINHO DA ELETRICIDADE
  // ============================================================

  const pathSteps = [
    { icon: "⚡", label: "Usina" },
    { icon: "🗼", label: "Torres" },
    { icon: "🏭", label: "Subestação" },
    { icon: "🔌", label: "Distribuição" },
    { icon: "🏠🏫🏥🏪", label: "Consumidores" }
  ];

  const questionToStep = [0, 0, 0, 1, 4];


  // ============================================================
  // ESTADO DO QUIZ
  // ============================================================

  let currentQuestion = 0;
  let score = 0;
  let selectedOption = null;
  let answers = new Array(questions.length).fill(null);
  let participantName = "";


  // ============================================================
  // ELEMENTOS HTML
  // ============================================================

  const screenHome = document.getElementById("screen-home");
  const screenQuiz = document.getElementById("screen-quiz");
  const screenResult = document.getElementById("screen-result");

  const btnPlay = document.getElementById("btn-play");
  const btnRules = document.getElementById("btn-rules");
  const btnCloseRules = document.getElementById("btn-close-rules");
  const modalRules = document.getElementById("modal-rules");

  const modalName = document.getElementById("modal-name");
  const inputName = document.getElementById("input-name");
  const nameError = document.getElementById("name-error");
  const btnStartQuiz = document.getElementById("btn-start-quiz");

  const questionCounter = document.getElementById("question-counter");
  const scoreCount = document.getElementById("score-count");
  const progressFill = document.getElementById("progress-fill");
  const pathStrip = document.getElementById("path-strip");
  const questionCard = document.getElementById("question-card");
  const questionText = document.getElementById("question-text");
  const optionsContainer = document.getElementById("options-container");

  const btnNext = document.getElementById("btn-next");

  const feedbackBox = document.getElementById("feedback-box");
  const feedbackTitle = document.getElementById("feedback-title");
  const feedbackExplanation =
    document.getElementById("feedback-explanation");

  const resultEstande =
    document.getElementById("result-estande");

  const resultHits =
    document.getElementById("result-hits");

  const resultPercent =
    document.getElementById("result-percent");

  const resultEmoji =
    document.getElementById("result-emoji");

  const resultMessage =
    document.getElementById("result-message");

  const resultCard =
    document.getElementById("result-card");

  const confettiBox =
    document.getElementById("confetti");

  const btnRestart =
    document.getElementById("btn-restart");


  // ============================================================
  // TROCAR DE TELA
  // ============================================================

  function showScreen(screen) {
    [screenHome, screenQuiz, screenResult]
      .forEach(s => s.classList.remove("active"));

    screen.classList.add("active");
  }


  // ============================================================
  // REGRAS
  // ============================================================

  btnRules.addEventListener("click", () => {
    modalRules.classList.add("active");
  });

  btnCloseRules.addEventListener("click", () => {
    modalRules.classList.remove("active");
  });

  modalRules.addEventListener("click", (e) => {
    if (e.target === modalRules) {
      modalRules.classList.remove("active");
    }
  });


  // ============================================================
  // ABRIR MODAL DO NOME
  // ============================================================

  btnPlay.addEventListener("click", () => {

    nameError.style.display = "none";

    inputName.classList.remove("invalid");

    inputName.value = "";

    modalName.classList.add("active");

    setTimeout(() => {
      inputName.focus();
    }, 200);
  });


  modalName.addEventListener("click", (e) => {

    if (e.target === modalName) {
      modalName.classList.remove("active");
    }

  });


  // ============================================================
  // COMEÇAR QUIZ
  // ============================================================

  function tentarComecarQuiz() {

    const nome = inputName.value.trim();

    if (nome === "") {

      nameError.style.display = "block";

      inputName.classList.add("invalid");

      inputName.focus();

      return;
    }

    participantName = nome;

    modalName.classList.remove("active");

    resetQuiz();

    showScreen(screenQuiz);

    renderQuestion();
  }


  btnStartQuiz.addEventListener(
    "click",
    tentarComecarQuiz
  );


  inputName.addEventListener("keydown", (e) => {

    if (e.key === "Enter") {
      tentarComecarQuiz();
    }

  });


  inputName.addEventListener("input", () => {

    if (inputName.value.trim() !== "") {

      nameError.style.display = "none";

      inputName.classList.remove("invalid");
    }

  });


  // ============================================================
  // RESETAR QUIZ
  // ============================================================

  function resetQuiz() {

    currentQuestion = 0;

    score = 0;

    selectedOption = null;

    answers =
      new Array(questions.length).fill(null);

    scoreCount.textContent = "0";
  }


  // ============================================================
  // MINI MAPA
  // ============================================================

  function renderPathStrip(activeIndex) {

    pathStrip.innerHTML = "";

    pathSteps.forEach((step, i) => {

      const el = document.createElement("span");

      el.className =
        i === activeIndex ? "step-active" : "";

      el.textContent = step.icon;

      el.title = step.label;

      pathStrip.appendChild(el);

      if (i < pathSteps.length - 1) {

        const arrow =
          document.createElement("span");

        arrow.className = "arrow";

        arrow.textContent = "→";

        pathStrip.appendChild(arrow);
      }

    });
  }


  // ============================================================
  // MOSTRAR PERGUNTA
  // ============================================================

  function renderQuestion() {

    const q = questions[currentQuestion];

    selectedOption =
      answers[currentQuestion];

    questionCounter.textContent =
      `Pergunta ${currentQuestion + 1} de ${questions.length}`;

    scoreCount.textContent =
      String(score);

    const progressPercent =
      ((currentQuestion) / questions.length) * 100 +
      (100 / questions.length) * 0.15;

    progressFill.style.width =
      Math.min(progressPercent, 100) + "%";

    renderPathStrip(
      questionToStep[currentQuestion]
    );


    // Animação

    questionCard.style.animation = "none";

    void questionCard.offsetWidth;

    questionCard.style.animation =
      "fadeInFast 0.45s ease";


    questionText.textContent =
      q.text;

    optionsContainer.innerHTML = "";

    optionsContainer.classList.remove(
      "answered"
    );

    feedbackBox.style.display = "none";

    feedbackBox.className =
      "feedback-box";


    const jaRespondida =
      selectedOption !== null;


    q.options.forEach((opt, idx) => {

      const div =
        document.createElement("div");

      let classes = "option";


      if (jaRespondida) {

        if (idx === q.correct) {
          classes += " correct";
        }

        else if (idx === selectedOption) {
          classes += " incorrect";
        }

      }


      div.className = classes;


      div.innerHTML =
        `<span class="dot"></span><span>${opt}</span>`;


      div.addEventListener(
        "click",
        () => selectOption(idx)
      );


      optionsContainer.appendChild(div);

    });


    if (jaRespondida) {

      optionsContainer.classList.add(
        "answered"
      );

      mostrarFeedback(
        selectedOption === q.correct,
        q
      );
    }


    updateNextButton();
  }


  // ============================================================
  // SELECIONAR RESPOSTA
  // ============================================================

  function selectOption(idx) {

    if (selectedOption !== null) {
      return;
    }


    selectedOption = idx;

    answers[currentQuestion] = idx;

    recalcScore();


    const q =
      questions[currentQuestion];


    document
      .querySelectorAll(".option")
      .forEach((el, i) => {

        if (i === q.correct) {
          el.classList.add("correct");
        }

        if (
          i === idx &&
          idx !== q.correct
        ) {
          el.classList.add("incorrect");
        }

      });


    optionsContainer.classList.add(
      "answered"
    );


    mostrarFeedback(
      idx === q.correct,
      q
    );


    updateNextButton();
  }


  // ============================================================
  // FEEDBACK
  // ============================================================

  function mostrarFeedback(acertou, q) {

    feedbackBox.style.display =
      "block";

    feedbackBox.className =
      "feedback-box " +
      (acertou ? "correct" : "incorrect");


    feedbackBox.style.animation =
      "none";

    void feedbackBox.offsetWidth;

    feedbackBox.style.animation = "";


    if (acertou) {

      feedbackTitle.textContent =
        "✅ ACERTOU!";

    } else {

      feedbackTitle.textContent =
        `❌ ERROU! A resposta correta é: "${q.options[q.correct]}"`;
    }


    feedbackExplanation.textContent =
      q.explanation;
  }


  // ============================================================
  // BOTÃO PRÓXIMA
  // ============================================================

  function updateNextButton() {

    if (selectedOption !== null) {

      btnNext.classList.add("enabled");

    } else {

      btnNext.classList.remove("enabled");
    }

  }


  btnNext.addEventListener(
    "click",
    () => {

      if (selectedOption === null) {
        return;
      }


      if (
        currentQuestion <
        questions.length - 1
      ) {

        currentQuestion++;

        renderQuestion();

      } else {

        finishQuiz();
      }

    }
  );


  // ============================================================
  // RECALCULAR PONTUAÇÃO
  // ============================================================

  function recalcScore() {

    score = 0;


    answers.forEach((ans, i) => {

      if (
        ans !== null &&
        ans === questions[i].correct
      ) {

        score++;
      }

    });


    scoreCount.textContent =
      String(score);
  }


  // ============================================================
  // SALVAR RESULTADO NO FIRESTORE
  // ============================================================

  async function salvarResultado(
    nome,
    acertos,
    total,
    porcentagem,
    ganhouPirulito
  ) {

    try {

      await addDoc(
        collection(db, "resultados"),
        {
          nome: nome,
          acertos: acertos,
          total: total,
          porcentagem: porcentagem,
          ganhouPirulito: ganhouPirulito,
          data: serverTimestamp()
        }
      );


      console.log(
        "✅ Resultado salvo no Firestore!"
      );


      return true;

    } catch (error) {

      console.error(
        "❌ Erro ao salvar resultado:",
        error
      );


      return false;
    }

  }


  // ============================================================
  // RESULTADO
  // ============================================================

  async function finishQuiz() {

    recalcScore();

    progressFill.style.width =
      "100%";


    const total =
      questions.length;

    const percent =
      Math.round(
        (score / total) * 100
      );


    // 3 ou mais acertos = ganhou

    const won =
      score >= 3;


    resultHits.textContent =
      String(score);

    resultPercent.textContent =
      String(percent);


    // ----------------------------------------------------------
    // SALVAR NO FIRESTORE
    // ----------------------------------------------------------

    const salvo =
      await salvarResultado(
        participantName,
        score,
        total,
        percent,
        won
      );


    // ----------------------------------------------------------
    // TELA DE RESULTADO
    // ----------------------------------------------------------

    if (won) {

      resultEmoji.textContent =
        "🍭";

      resultEmoji.classList.add(
        "win"
      );


      resultCard
        .querySelector(".result-title")
        .textContent =
        "🎉 PARABÉNS! VOCÊ GANHOU O PIRULITO!";


      resultMessage.className =
        "result-message win";


      resultMessage.textContent =
        "Você aprendeu muito bem o caminho da eletricidade!";


      resultEstande.style.display =
        "block";


      launchConfetti();

    } else {

      resultEmoji.textContent =
        "📚";


      resultEmoji.classList.remove(
        "win"
      );


      resultCard
        .querySelector(".result-title")
        .textContent =
        "😕 VOCÊ NÃO GANHOU O PIRULITO";


      resultMessage.className =
        "result-message lose";


      resultMessage.textContent =
        "Você não atingiu a pontuação mínima para ganhar o pirulito. Tente novamente!";


      resultEstande.style.display =
        "none";
    }


    // Aviso discreto no console
    if (!salvo) {

      console.warn(
        "O resultado não pôde ser salvo no Firebase."
      );
    }


    showScreen(screenResult);
  }


  // ============================================================
  // CONFETES
  // ============================================================

  function launchConfetti() {

    confettiBox.innerHTML = "";

    const emojis = [
      "🍭",
      "⚡",
      "🎉",
      "✨",
      "🍬"
    ];


    for (
      let i = 0;
      i < 24;
      i++
    ) {

      const span =
        document.createElement("span");


      span.textContent =
        emojis[
          Math.floor(
            Math.random() *
            emojis.length
          )
        ];


      span.style.left =
        Math.random() * 100 + "%";


      span.style.animationDelay =
        Math.random() * 0.6 + "s";


      span.style.fontSize =
        14 + Math.random() * 14 + "px";


      confettiBox.appendChild(span);
    }

  }


  // ============================================================
  // JOGAR NOVAMENTE
  // ============================================================

    btnRestart.addEventListener(
    "click",
    () => {

      resetQuiz();

      showScreen(screenQuiz);

      renderQuestion();

    
  );

</script>
