
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Caminho da Eletricidade</title>

<style>
  :root{
    --azul-escuro:#0B3D63;
    --azul-escuro-2:#133F6B;
    --azul-claro:#4FB6E8;
    --azul-claro-2:#DDF3FC;
    --verde:#34A853;
    --verde-claro:#E7F8EC;
    --amarelo:#FFC93C;
    --amarelo-escuro:#E8A800;
    --branco:#FFFFFF;
    --cinza-texto:#365064;
    --fundo-1:#F4FBFF;
    --fundo-2:#EAF6FC;
    --card:#FFFFFF;
    --option:#F7FBFD;
    --option-border:#E3F1F8;
    --danger:#E0564A;
    --danger-bg:#FDEAEA;
    --sombra:0 10px 30px rgba(11,61,99,.12);
    --sombra-forte:0 16px 40px rgba(11,61,99,.22);
    --radius:22px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 10%,rgba(79,182,232,.18),transparent 45%),
      radial-gradient(circle at 85% 90%,rgba(255,201,60,.15),transparent 45%),
      linear-gradient(180deg,var(--fundo-1) 0%,var(--fundo-2) 100%);
    color:var(--cinza-texto);
    overflow-x:hidden;
    transition:background .3s ease,color .3s ease;
  }

  body.dark{
    --fundo-1:#071B2B;
    --fundo-2:#0B263B;
    --card:#102F46;
    --branco:#102F46;
    --cinza-texto:#D8EAF4;
    --azul-claro-2:#163D56;
    --option:#12344B;
    --option-border:#28536D;
    --verde-claro:#163E2A;
    --danger-bg:#4A2424;
    --azul-escuro:#7ED2F7;
  }

  body.dark .home-title,
  body.dark .question-text,
  body.dark .result-title,
  body.dark .modal-title,
  body.dark .quiz-top{
    color:#8BD9FA;
  }

  body.dark .home-subtitle{color:#7CCBF0;}
  body.dark .btn-secondary{
    background:#12344B;
    color:#9DDBF5;
    border-color:#28536D;
  }
  body.dark .btn-secondary:hover{background:#18445E;}
  body.dark .path-strip{background:#163D56;}
  body.dark .path-strip .step-active{background:#204D68;}
  body.dark .progress-track{background:#163D56;}
  body.dark .option{color:#D8EAF4;}
  body.dark .feedback-explanation{color:#D8EAF4;}
  body.dark .modal-overlay{background:rgba(0,10,20,.72);}
  body.dark .settings-row{
    background:#12344B;
    border-color:#28536D;
  }
  body.dark .settings-select{
    background:#0D2A3F;
    color:#E1F3FC;
    border-color:#37647D;
  }
  body.dark .settings-modal .modal-close{
    background:#4FB6E8;
    color:#08243A;
  }

  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .screen{
    width:100%;
    max-width:640px;
    display:none;
    animation:fadeIn .6s ease;
  }

  .screen.active{display:block;}

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }

  @keyframes fadeInFast{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  @keyframes popIn{
    0%{transform:scale(.85);opacity:0;}
    60%{transform:scale(1.03);opacity:1;}
    100%{transform:scale(1);}
  }

  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }

  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.55);}
    50%{box-shadow:0 0 0 14px rgba(255,201,60,0);}
  }

  @keyframes shake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }

  @keyframes confettiFall{
    from{transform:translateY(-40px) rotate(0deg);opacity:1;}
    to{transform:translateY(340px) rotate(360deg);opacity:0;}
  }

  @keyframes timerPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }

  @keyframes modalSlide{
    from{opacity:0;transform:translateY(25px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .no-animations *,
  .no-animations *::before,
  .no-animations *::after{
    animation:none !important;
    transition:none !important;
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
    }
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--sombra);
    padding:36px 30px;
    transition:background .3s ease,box-shadow .3s ease;
  }

  /* ---------- BOTÃO DE CONFIGURAÇÕES ---------- */

  .settings-button{
    position:fixed;
    top:18px;
    right:18px;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:var(--card);
    color:var(--azul-escuro);
    box-shadow:var(--sombra);
    cursor:pointer;
    z-index:40;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .22s ease,box-shadow .22s ease,background .3s ease;
  }

  .settings-button:hover{
    transform:rotate(25deg) scale(1.06);
    box-shadow:var(--sombra-forte);
  }

  .settings-button:active{transform:scale(.94);}

  /* ---------- TELA INICIAL ---------- */

  .home-card{
    text-align:center;
    position:relative;
    overflow:hidden;
    padding:46px 30px 38px;
  }

  .home-card::before{
    content:"";
    position:absolute;
    top:-60px;
    right:-60px;
    width:180px;
    height:180px;
    background:radial-gradient(circle,rgba(255,201,60,.35),transparent 70%);
    border-radius:50%;
  }

  .home-card::after{
    content:"";
    position:absolute;
    bottom:-70px;
    left:-70px;
    width:200px;
    height:200px;
    background:radial-gradient(circle,rgba(79,182,232,.3),transparent 70%);
    border-radius:50%;
  }

  .bolt-icon{
    font-size:54px;
    display:inline-block;
    animation:bounce 2.4s ease-in-out infinite;
    filter:drop-shadow(0 6px 10px rgba(255,201,60,.5));
  }

  .home-title{
    font-size:clamp(24px,5vw,32px);
    color:var(--azul-escuro);
    margin:10px 0 6px;
    font-weight:800;
    letter-spacing:.2px;
  }

  .home-subtitle{
    font-size:clamp(15px,3vw,18px);
    color:var(--azul-claro);
    font-weight:600;
    margin-bottom:22px;
  }

  .lollipop-line{
    font-size:clamp(15px,3vw,17px);
    background:var(--amarelo);
    color:#6b4a00;
    display:inline-block;
    padding:10px 20px;
    border-radius:999px;
    font-weight:700;
    margin-bottom:28px;
    box-shadow:0 6px 16px rgba(255,201,60,.4);
  }

  .btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    border-radius:16px;
    transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;
  }

  .btn:active{transform:scale(.96);}

  .btn-primary{
    background:linear-gradient(135deg,var(--azul-claro),#2E9FD6);
    color:#fff;
    font-size:clamp(17px,3.4vw,20px);
    padding:16px 46px;
    box-shadow:0 10px 24px rgba(46,159,214,.45);
    display:inline-flex;
    align-items:center;
    gap:10px;
  }

  .btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 28px rgba(46,159,214,.55);
  }

  .btn-secondary{
    background:var(--card);
    color:var(--azul-escuro);
    border:2px solid var(--azul-claro-2);
    font-size:clamp(14px,3vw,16px);
    padding:12px 26px;
    margin-top:18px;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }

  .btn-secondary:hover{
    background:var(--azul-claro-2);
    transform:translateY(-2px);
  }

  /* ---------- MODAIS ---------- */

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(11,61,99,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
    overflow-y:auto;
  }

  .modal-overlay.active{
    display:flex;
    animation:fadeInFast .25s ease;
  }

  .modal-box{
    background:var(--card);
    border-radius:var(--radius);
    padding:30px 26px;
    max-width:420px;
    width:100%;
    box-shadow:var(--sombra-forte);
    animation:popIn .35s ease;
  }

  .modal-title{
    color:var(--azul-escuro);
    font-size:22px;
    font-weight:800;
    margin:0 0 18px;
    text-align:center;
  }

  .rule-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--azul-claro-2);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    font-size:15px;
    line-height:1.4;
  }

  .rule-item.lollipop{background:#FFF3D6;}
  .rule-emoji{font-size:22px;flex-shrink:0;}

  .modal-close{
    display:block;
    margin:16px auto 0;
    background:var(--azul-escuro);
    color:#fff;
    padding:12px 30px;
    font-size:15px;
    border-radius:14px;
  }

  .modal-close:hover{background:var(--azul-escuro-2);}

  .name-modal-subtitle{
    text-align:center;
    font-size:15px;
    color:var(--cinza-texto);
    margin:0 0 16px;
  }

  .name-input{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:14px 16px;
    border-radius:14px;
    border:2px solid var(--azul-claro-2);
    outline:none;
    color:var(--azul-escuro);
    font-weight:600;
    transition:border-color .2s ease,box-shadow .2s ease;
    background:var(--card);
  }

  .name-input:focus{
    border-color:var(--azul-claro);
    box-shadow:0 0 0 4px rgba(79,182,232,.18);
  }

  .name-input.invalid{
    border-color:#E0564A;
    animation:shake .5s ease;
  }

  .name-error{
    color:#C7392E;
    font-size:13px;
    font-weight:700;
    margin:8px 2px 0;
  }

  /* ---------- CONFIGURAÇÕES ---------- */

  .settings-modal{
    max-width:520px;
    max-height:min(760px,92vh);
    overflow-y:auto;
    padding:26px;
  }

  .settings-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }

  .settings-header .modal-title{
    margin:0;
    flex:1;
  }

  .settings-x{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:var(--azul-claro-2);
    color:var(--azul-escuro);
    font-size:20px;
    font-weight:800;
    cursor:pointer;
  }

  .settings-section-title{
    color:var(--azul-claro);
    font-size:13px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin:20px 0 9px;
  }

  .settings-row{
    background:#F7FBFD;
    border:1px solid #E3F1F8;
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
  }

  .settings-row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .settings-label{
    font-size:15px;
    font-weight:800;
    color:var(--cinza-texto);
  }

  .settings-description{
    font-size:12px;
    margin-top:3px;
    opacity:.72;
  }

  .toggle{
    position:relative;
    width:52px;
    height:30px;
    flex-shrink:0;
  }

  .toggle input{
    opacity:0;
    width:0;
    height:0;
  }

  .toggle-slider{
    position:absolute;
    inset:0;
    background:#B9DCEC;
    border-radius:999px;
    cursor:pointer;
    transition:.25s ease;
  }

  .toggle-slider::before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:4px;
    top:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
    transition:.25s ease;
  }

  .toggle input:checked + .toggle-slider{
    background:var(--verde);
  }

  .toggle input:checked + .toggle-slider::before{
    transform:translateX(22px);
  }

  .range-wrap{
    margin-top:12px;
  }

  .range-line{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .range-line input{
    flex:1;
    accent-color:var(--azul-claro);
    cursor:pointer;
  }

  .range-value{
    min-width:48px;
    text-align:right;
    font-size:13px;
    font-weight:800;
    color:var(--azul-claro);
  }

  .settings-select{
    width:100%;
    margin-top:10px;
    padding:11px 12px;
    border-radius:12px;
    border:2px solid var(--azul-claro-2);
    background:#fff;
    color:var(--azul-escuro);
    font-family:inherit;
    font-weight:700;
    outline:none;
    cursor:pointer;
  }

  .settings-footer{
    display:flex;
    justify-content:center;
    margin-top:18px;
  }

  .settings-footer .modal-close{
    margin:0;
    width:100%;
  }

  /* ---------- QUIZ ---------- */

  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-weight:700;
    color:var(--azul-escuro);
    font-size:15px;
    gap:10px;
  }

  .quiz-top-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .score-pill{
    background:var(--verde-claro);
    color:var(--verde);
    padding:6px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:800;
  }

  .timer-pill{
    background:var(--azul-claro-2);
    color:var(--azul-escuro);
    padding:6px 12px;
    border-radius:999px;
    font-size:14px;
    font-weight:900;
    min-width:66px;
    text-align:center;
    transition:background .2s ease,color .2s ease;
  }

  .timer-pill.warning{
    background:#FFF3D6;
    color:#9B6B00;
    animation:timerPulse .8s ease-in-out infinite;
  }

  .timer-pill.danger{
    background:var(--danger-bg);
    color:#C7392E;
    animation:timerPulse .55s ease-in-out infinite;
  }

  .timer-pill.unlimited{
    background:var(--azul-claro-2);
    color:var(--azul-claro);
  }

  .progress-track{
    width:100%;
    height:12px;
    background:var(--azul-claro-2);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:22px;
  }

  .progress-fill{
    height:100%;
    width:10%;
    background:linear-gradient(90deg,var(--azul-claro),var(--verde));
    border-radius:999px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  .path-strip{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    background:var(--azul-claro-2);
    border-radius:14px;
    padding:10px 8px;
    margin-bottom:20px;
    font-size:20px;
  }

  .path-strip .arrow{
    color:var(--azul-claro);
    font-size:16px;
  }

  .path-strip .step-active{
    background:var(--card);
    border-radius:10px;
    padding:4px 8px;
    box-shadow:0 4px 10px rgba(11,61,99,.15);
    animation:pulse 1.8s ease-in-out infinite;
  }

  .question-card{animation:fadeInFast .45s ease;}

  .question-text{
    color:var(--azul-escuro);
    font-size:clamp(18px,3.6vw,21px);
    font-weight:800;
    margin:4px 0 20px;
    line-height:1.4;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:26px;
  }

  .option{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--option);
    border:2px solid var(--option-border);
    border-radius:16px;
    padding:14px 16px;
    cursor:pointer;
    font-size:clamp(14px,3vw,16px);
    font-weight:600;
    color:var(--cinza-texto);
    transition:all .22s ease;
  }

  .option:hover{
    border-color:var(--azul-claro);
    transform:translateX(4px);
    background:var(--azul-claro-2);
  }

  .option .dot{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2.5px solid #B9DCEC;
    flex-shrink:0;
    transition:all .22s ease;
    position:relative;
  }

  .option.selected{
    border-color:var(--verde);
    background:var(--verde-claro);
    transform:scale(1.015);
    box-shadow:0 6px 16px rgba(52,168,83,.2);
  }

  .option.selected .dot{
    border-color:var(--verde);
    background:var(--verde);
  }

  .option.selected .dot::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    font-weight:900;
  }

  .option.correct{
    border-color:var(--verde);
    background:var(--verde-claro);
    box-shadow:0 6px 16px rgba(52,168,83,.2);
  }

  .option.correct .dot{
    border-color:var(--verde);
    background:var(--verde);
  }

  .option.correct .dot::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:13px;
    font-weight:900;
  }

  .option.incorrect{
    border-color:#E0564A;
    background:var(--danger-bg);
    animation:shake .5s ease;
  }

  .option.incorrect .dot{
    border-color:#E0564A;
    background:#E0564A;
  }

  .option.incorrect .dot::after{
    content:"✕";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:900;
  }

  .options.answered .option{cursor:default;}

  .options.answered .option:hover{
    transform:none;
    background:inherit;
    border-color:inherit;
  }

  .options.answered .option.correct:hover{background:var(--verde-claro);}
  .options.answered .option.incorrect:hover{background:var(--danger-bg);}

  .feedback-box{
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:20px;
    animation:popIn .4s ease;
  }

  .feedback-box.correct{
    background:var(--verde-claro);
    border:2px solid var(--verde);
  }

  .feedback-box.incorrect{
    background:var(--danger-bg);
    border:2px solid #E0564A;
    animation:popIn .4s ease,shake .5s ease;
  }

  .feedback-box.timeout{
    background:#FFF3D6;
    border:2px solid var(--amarelo-escuro);
  }

  body.dark .feedback-box.timeout{
    background:#493D20;
    border-color:#D3A62A;
  }

  .feedback-title{
    font-size:17px;
    font-weight:900;
    margin:0 0 6px;
  }

  .feedback-box.correct .feedback-title{color:var(--verde);}
  .feedback-box.incorrect .feedback-title{color:#C7392E;}
  .feedback-box.timeout .feedback-title{color:#9B6B00;}

  .feedback-explanation{
    font-size:14px;
    margin:0;
    color:var(--cinza-texto);
    line-height:1.4;
  }

  .btn-next{
    width:100%;
    background:linear-gradient(135deg,#BFE3F2,#A9D9EE);
    color:#7CA7BB;
    font-size:17px;
    padding:15px;
    cursor:not-allowed;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn-next.enabled{
    background:linear-gradient(135deg,var(--verde),#2C9148);
    color:#fff;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(52,168,83,.4);
  }

  .btn-next.enabled:hover{transform:translateY(-3px);}

  /* ---------- RESULTADO ---------- */

  .result-card{
    text-align:center;
    position:relative;
    overflow:hidden;
    padding:42px 28px;
  }

  .result-emoji{
    font-size:56px;
    animation:popIn .6s ease;
  }

  .result-emoji.win{
    animation:popIn .6s ease,bounce 2s ease-in-out .6s infinite;
  }

  .result-title{
    color:var(--azul-escuro);
    font-size:26px;
    font-weight:900;
    margin:12px 0 6px;
  }

  .result-score{
    font-size:18px;
    color:var(--cinza-texto);
    margin-bottom:4px;
  }

  .result-percent{
    font-size:42px;
    font-weight:900;
